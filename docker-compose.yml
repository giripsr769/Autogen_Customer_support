services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: autogen_backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: autogen_frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped